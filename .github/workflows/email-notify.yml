name: Push Email Notification

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Multi-Commit Email Content
        shell: python
        run: |
          import json, os, datetime
          
          # Read the GitHub push event payload
          with open(os.environ['GITHUB_EVENT_PATH'], 'r') as f:
              event = json.load(f)
              
          commits = event.get('commits', [])
          
          # Build the top-level branch and repository info
          body = f"Branch: {event.get('ref')}\n"
          body += f"Home:   {event.get('repository', {}).get('html_url')}\n\n"
          
          # Loop through every commit in the push
          for c in commits:
              body += f"Commit: {c['id']}\n"
              body += f"    {c['url']}\n"
              
              author = c.get('author', {})
              body += f"Author: {author.get('name', 'Unknown')} <{author.get('email', 'unknown@example.com')}>\n"
              
              # Format the timestamp to match the legacy layout
              timestamp = c.get('timestamp', '')
              try:
                  dt = datetime.datetime.fromisoformat(timestamp.replace('Z', '+00:00'))
                  date_str = dt.strftime('%Y-%m-%d (%a, %d %b %Y)')
              except:
                  date_str = timestamp
                  
              body += f"Date:   {date_str}\n\n"
              
              # List the files modified, added, or removed in this specific commit
              body += "Changed paths:\n"
              for p in c.get('modified', []): body += f"    M {p}\n"
              for p in c.get('added', []):    body += f"    A {p}\n"
              for p in c.get('removed', []):  body += f"    R {p}\n"
              
              body += "\nLog Message:\n-----------\n"
              body += c.get('message', '') + "\n\n"
          
          # Grab the first line of the most recent commit's message for the subject line
          subject_msg = "No commit message"
          if commits:
              subject_msg = commits[-1].get('message', '').split('\n')[0]
              
          # Write the generated body and subject directly to GitHub's environment variables
          env_file = os.environ['GITHUB_ENV']
          with open(env_file, 'a') as f:
              f.write("EMAIL_BODY<<EOF_EMAIL\n")
              f.write(body)
              f.write("\nEOF_EMAIL\n")
              f.write(f"COMMIT_SUBJECT={subject_msg}\n")

      - name: Send email to subscribers via AWS SES
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: 3675ceinjt98.fips.qbns.mail-manager-smtp.amazonaws.com 
          server_port: 587
          secure: false
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}
          
          # Use the variables generated by the Python script
          subject: "${{ github.event.repository.name }}/${{ github.ref_name }}: ${{ env.COMMIT_SUBJECT }}"
          from: "'${{github.actor}}' Inquisit GitHub <inquisit@millisecond.com>"
          to: millisecond@googlegroups.com
          body: ${{ env.EMAIL_BODY }}